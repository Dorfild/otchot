---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Create web root directory
  file:
    path: /var/www/madbox098
    state: directory
    owner: sa
    group: sa
    mode: '0755'

- name: Configure nginx site
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/madbox098
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable madbox098 site
  file:
    src: /etc/nginx/sites-available/madbox098
    dest: /etc/nginx/sites-enabled/madbox098
    state: link
  notify: Reload nginx

- name: Validate nginx configuration
  command: nginx -t
  changed_when: false

- name: Enable nginx service
  systemd:
    name: nginx
    enabled: yes
    state: started
