---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

- name: Install base utilities
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - unzip
      - fail2ban
      - ufw
    state: present

- name: Enable UFW firewall
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH through firewall
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow HTTP through firewall
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS through firewall
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started
